[package]
name = "drakarys-near"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "unstable"] }
secp256k1 = { version = "0.30", features = ["recovery", "global-context"] }
tiny-keccak = { version = "2", features = ["keccak"] }
